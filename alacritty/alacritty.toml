general.live_config_reload = true
general.import = ["themes/zenbones_dark.toml"]

[font]
size = 16.0
normal = { family = "IosevkaTerm NFM", style = "Regular" }
bold = { family = "IosevkaTerm NFM SemiBold", style = "SemiBold" }
italic = { family = "IosevkaTerm NFM Light", style = "Light" }
bold_italic = { family = "IosevkaTerm NFM SemiBold", style = "SemiBold" }

[cursor]
style = { shape = "Block", blinking = "Never" }

[window]
opacity = 0.9
blur = false
option_as_alt = "Both"
# decorations = "Buttonless"
decorations = "None"
dynamic_padding = true
dimensions = { columns = 160, lines = 36 }
position = { x = 340, y = 500 }
padding = { x = 10, y = 0 }

[env]
TERM = "xterm-256color"
